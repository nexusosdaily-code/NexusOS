<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10103a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2fff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#4fc3f7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="beam2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e040fb;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ab47bc;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="beam3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#69f0ae;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- NIC card body -->
  <rect x="160" y="160" width="520" height="310" rx="12" fill="url(#card)" stroke="#4fc3f7" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- PCIe connector -->
  <rect x="160" y="420" width="520" height="50" rx="4" fill="#0a0a1a" stroke="#4fc3f7" stroke-opacity="0.2" stroke-width="1" />
  <g fill="#4fc3f7" fill-opacity="0.4">
    <rect x="175" y="428" width="4" height="34" rx="1" />
    <rect x="185" y="428" width="4" height="34" rx="1" />
    <rect x="195" y="428" width="4" height="34" rx="1" />
    <rect x="205" y="428" width="4" height="34" rx="1" />
    <rect x="215" y="428" width="4" height="34" rx="1" />
    <rect x="225" y="428" width="4" height="34" rx="1" />
    <rect x="235" y="428" width="4" height="34" rx="1" />
    <rect x="245" y="428" width="4" height="34" rx="1" />
    <rect x="255" y="428" width="4" height="34" rx="1" />
    <rect x="265" y="428" width="4" height="34" rx="1" />
    <rect x="275" y="428" width="4" height="34" rx="1" />
    <rect x="285" y="428" width="4" height="34" rx="1" />
    <rect x="295" y="428" width="4" height="34" rx="1" />
    <rect x="305" y="428" width="4" height="34" rx="1" />
    <rect x="315" y="428" width="4" height="34" rx="1" />
    <rect x="325" y="428" width="4" height="34" rx="1" />
    <rect x="335" y="428" width="4" height="34" rx="1" />
    <rect x="345" y="428" width="4" height="34" rx="1" />
    <rect x="355" y="428" width="4" height="34" rx="1" />
    <rect x="365" y="428" width="4" height="34" rx="1" />
  </g>

  <!-- Photonic waveguide channels — beams -->
  <rect x="700" y="190" width="350" height="8" rx="4" fill="url(#beam1)" opacity="0.9" />
  <rect x="700" y="218" width="350" height="6" rx="3" fill="url(#beam2)" opacity="0.7" />
  <rect x="700" y="242" width="350" height="8" rx="4" fill="url(#beam3)" opacity="0.8" />
  <rect x="700" y="268" width="350" height="5" rx="2" fill="url(#beam1)" opacity="0.6" />
  <rect x="700" y="290" width="350" height="7" rx="3" fill="url(#beam2)" opacity="0.75" />
  <rect x="700" y="315" width="350" height="6" rx="3" fill="url(#beam3)" opacity="0.65" />
  <rect x="700" y="338" width="350" height="8" rx="4" fill="url(#beam1)" opacity="0.85" />
  <rect x="700" y="362" width="350" height="5" rx="2" fill="url(#beam2)" opacity="0.7" />
  <rect x="700" y="384" width="350" height="7" rx="3" fill="url(#beam3)" opacity="0.8" />

  <!-- Waveguide output panel -->
  <rect x="680" y="175" width="20" height="240" rx="4" fill="#0d1a2a" stroke="#4fc3f7" stroke-opacity="0.5" stroke-width="1" />

  <!-- Chip on NIC -->
  <rect x="260" y="200" width="120" height="120" rx="6" fill="#080820" stroke="#7c4dff" stroke-opacity="0.6" stroke-width="1.5" />
  <text x="320" y="255" font-family="monospace" font-size="11" fill="#7c4dff" fill-opacity="0.9" text-anchor="middle">SNIC</text>
  <text x="320" y="272" font-family="monospace" font-size="9" fill="#4fc3f7" fill-opacity="0.7" text-anchor="middle">v1.0</text>

  <!-- Main label -->
  <text x="600" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">SNIC</text>
  <text x="600" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#4fc3f7" text-anchor="middle" letter-spacing="2">Spectral Network Interface Card</text>

  <!-- Channel count -->
  <text x="600" y="560" font-family="monospace" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">51,200 Orthogonal Channels</text>
  <text x="600" y="590" font-family="monospace" font-size="14" fill="#4fc3f7" fill-opacity="0.8" text-anchor="middle">256 WDM × 50 OAM × 2 Pol × 2 Dir  ·  ⟨Ψᵢ|Ψⱼ⟩ = 0</text>

  <!-- NexusOS badge -->
  <text x="60" y="45" font-family="monospace" font-size="13" fill="#ffffff" fill-opacity="0.4">NexusOS · AGPL-3.0 · 2026</text>
</svg>
