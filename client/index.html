    <script>
      // Suppress HMR WebSocket errors — Vite's dev client cannot reach
      // the HMR WebSocket through Replit's reverse proxy, so these errors
      // are expected and should not propagate as unhandled rejections.
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && (e.reason.message || String(e.reason));
        if (msg && (msg.includes('WebSocket') || msg.includes('vite-hmr') || msg.includes('failed to connect'))) {
          e.preventDefault();
        }
      });
    </script>
