  ══════════════════════════════════════════════════ -->
  <rect x="480" y="490" width="304" height="112" fill="none" stroke="#000" stroke-width="1"/>
  <!-- vertical dividers -->
  <line x1="600" y1="490" x2="600" y2="602" stroke="#000" stroke-width="0.8"/>
  <!-- horizontal dividers -->
  <line x1="480" y1="518" x2="784" y2="518" stroke="#000" stroke-width="0.8"/>
  <line x1="480" y1="546" x2="784" y2="546" stroke="#000" stroke-width="0.8"/>
  <line x1="480" y1="574" x2="784" y2="574" stroke="#000" stroke-width="0.8"/>

  <text x="484" y="508" font-size="7" fill="#555">TITLE</text>
  <text x="532" y="513" font-size="9" font-weight="bold" fill="#000">PHR-1 Bifilar Toroid — Prototype</text>

  <text x="484" y="536" font-size="7" fill="#555">DWG No.</text>
  <text x="532" y="541" font-size="9" fill="#000">NEXOS-PHR1-T001</text>
  <text x="604" y="536" font-size="7" fill="#555">REV</text>
  <text x="640" y="541" font-size="9" fill="#000">A</text>

  <text x="484" y="564" font-size="7" fill="#555">DATE</text>
  <text x="532" y="569" font-size="9" fill="#000">2026-07-03</text>
  <text x="604" y="564" font-size="7" fill="#555">SCALE</text>
  <text x="640" y="569" font-size="9" fill="#000">2:1</text>

  <text x="484" y="592" font-size="7" fill="#555">PROJECT</text>
  <text x="532" y="597" font-size="9" fill="#000">NexusOS — WNSP PHR-1</text>
  <text x="604" y="592" font-size="7" fill="#555">DRAWN</text>
  <text x="640" y="597" font-size="9" fill="#000">T. Pou</text>

  <!-- ═══════════════════════════════════════════════
       HEADING
  ══════════════════════════════════════════════════ -->
  <text x="40" y="55" font-size="14" font-weight="bold" fill="#000">PHR-1  Photonic Harmonic Resonator-1</text>
  <text x="40" y="72" font-size="10" fill="#444">Bifilar Toroidal Inductor — Prototype Drawing — Pinout A (Vertical)</text>

  <!-- ═══════════════════════════════════════════════
       FRONT ELEVATION (left panel)
       Toroid standing upright, 4 leads pointing down
       OD=32mm, ID=16mm, H=16mm at 2:1 scale → px: OD=64, ID=32, H=32
  ══════════════════════════════════════════════════ -->
  <text x="100" y="108" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">FRONT ELEVATION</text>
  <text x="100" y="120" font-size="8" text-anchor="middle" fill="#555">(Pinout A — Vertical)</text>

  <!-- toroid body front view: rectangle with rounded top representing torus cross-section -->
  <!-- left half of torus body -->
  <rect x="52" y="140" width="28" height="32" rx="6" ry="6" fill="#d0e8f8" stroke="#1a5276" stroke-width="1.5"/>
  <!-- right half of torus body -->
  <rect x="120" y="140" width="28" height="32" rx="6" ry="6" fill="#d0e8f8" stroke="#1a5276" stroke-width="1.5"/>
  <!-- top connecting bar (top of torus) -->
  <rect x="58" y="135" width="84" height="14" rx="4" ry="4" fill="#d0e8f8" stroke="#1a5276" stroke-width="1.5"/>
  <!-- bottom connecting bar (bottom of torus) -->
  <rect x="58" y="158" width="84" height="14" rx="4" ry="4" fill="#d0e8f8" stroke="#1a5276" stroke-width="1.5"/>

  <!-- Winding marks on left side (bifilar: two colors) -->
  <line x1="52" y1="148" x2="44" y2="148" stroke="#c0392b" stroke-width="2"/>
  <line x1="52" y1="154" x2="44" y2="154" stroke="#1a5276" stroke-width="2"/>
  <line x1="52" y1="160" x2="44" y2="160" stroke="#c0392b" stroke-width="2"/>
  <line x1="52" y1="166" x2="44" y2="166" stroke="#1a5276" stroke-width="2"/>
  <!-- Winding marks on right side -->
  <line x1="148" y1="148" x2="156" y2="148" stroke="#c0392b" stroke-width="2"/>
  <line x1="148" y1="154" x2="156" y2="154" stroke="#1a5276" stroke-width="2"/>
  <line x1="148" y1="160" x2="156" y2="160" stroke="#c0392b" stroke-width="2"/>
  <line x1="148" y1="166" x2="156" y2="166" stroke="#1a5276" stroke-width="2"/>
  <!-- Winding marks on top -->
  <line x1="78" y1="135" x2="78" y2="127" stroke="#c0392b" stroke-width="2"/>
  <line x1="86" y1="135" x2="86" y2="127" stroke="#1a5276" stroke-width="2"/>
  <line x1="114" y1="135" x2="114" y2="127" stroke="#c0392b" stroke-width="2"/>
  <line x1="122" y1="135" x2="122" y2="127" stroke="#1a5276" stroke-width="2"/>

  <!-- 4 leads (Pinout A Vertical — leads go straight down) -->
  <!-- Lead 1 (Conductor A start) - red -->
  <line x1="72" y1="172" x2="72" y2="295" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Lead 2 (Conductor B start) - blue -->
  <line x1="80" y1="172" x2="80" y2="295" stroke="#1a5276" stroke-width="2.5"/>
  <!-- Lead 3 (Conductor A end) - red, dashed -->
  <line x1="120" y1="172" x2="120" y2="295" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3"/>
  <!-- Lead 4 (Conductor B end) - blue, dashed -->
  <line x1="128" y1="172" x2="128" y2="295" stroke="#1a5276" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- Lead length dimension -->
  <line x1="44" y1="172" x2="44" y2="295" stroke="#000" stroke-width="0.8"/>
  <line x1="40" y1="172" x2="48" y2="172" stroke="#000" stroke-width="0.8"/>
  <line x1="40" y1="295" x2="48" y2="295" stroke="#000" stroke-width="0.8"/>
  <text x="38" y="235" font-size="8" text-anchor="middle" fill="#000" transform="rotate(-90,38,235)">60mm MIN LEAD</text>

  <!-- Height dimension -->
  <line x1="168" y1="135" x2="168" y2="172" stroke="#000" stroke-width="0.8"/>
  <line x1="164" y1="135" x2="172" y2="135" stroke="#000" stroke-width="0.8"/>
  <line x1="164" y1="172" x2="172" y2="172" stroke="#000" stroke-width="0.8"/>
  <text x="178" y="158" font-size="8" fill="#000">H</text>
  <text x="178" y="168" font-size="7" fill="#555">(see table)</text>

  <!-- OD dimension -->
  <line x1="52" y1="305" x2="148" y2="305" stroke="#000" stroke-width="0.8"/>
  <line x1="52" y1="301" x2="52" y2="309" stroke="#000" stroke-width="0.8"/>
  <line x1="148" y1="301" x2="148" y2="309" stroke="#000" stroke-width="0.8"/>
  <text x="100" y="320" font-size="8" text-anchor="middle" fill="#000">OD (see table)</text>

  <!-- Lead labels -->
  <text x="72" y="302" font-size="7" text-anchor="middle" fill="#c0392b">P1</text>
  <text x="80" y="302" font-size="7" text-anchor="middle" fill="#1a5276">P2</text>
  <text x="120" y="302" font-size="7" text-anchor="middle" fill="#c0392b">P3</text>
  <text x="128" y="302" font-size="7" text-anchor="middle" fill="#1a5276">P4</text>

  <!-- ═══════════════════════════════════════════════
       TOP / PLAN VIEW (centre panel)
  ══════════════════════════════════════════════════ -->
  <text x="320" y="108" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">PLAN VIEW</text>
  <text x="320" y="120" font-size="8" text-anchor="middle" fill="#555">(top down)</text>

  <!-- Outer ring -->
  <circle cx="320" cy="210" r="70" fill="#d0e8f8" stroke="#1a5276" stroke-width="1.5"/>
  <!-- Inner hole -->
  <circle cx="320" cy="210" r="35" fill="white" stroke="#1a5276" stroke-width="1.5"/>

  <!-- Bifilar winding marks around ring (alternating red/blue dashes) -->
  <g stroke-width="3">
    <!-- Top arc winding marks -->
    <line x1="302" y1="142" x2="298" y2="134" stroke="#c0392b" stroke-width="2.5"/>
    <line x1="320" y1="140" x2="320" y2="132" stroke="#1a5276" stroke-width="2.5"/>
    <line x1="338" y1="142" x2="342" y2="134" stroke="#c0392b" stroke-width="2.5"/>
    <!-- Right arc -->
    <line x1="385" y1="195" x2="393" y2="192" stroke="#1a5276" stroke-width="2.5"/>
    <line x1="387" y1="215" x2="395" y2="215" stroke="#c0392b" stroke-width="2.5"/>
    <!-- Bottom arc -->
    <line x1="338" y1="278" x2="342" y2="286" stroke="#1a5276" stroke-width="2.5"/>
    <line x1="320" y1="280" x2="320" y2="288" stroke="#c0392b" stroke-width="2.5"/>
    <line x1="302" y1="278" x2="298" y2="286" stroke="#1a5276" stroke-width="2.5"/>
    <!-- Left arc -->
    <line x1="255" y1="215" x2="247" y2="215" stroke="#c0392b" stroke-width="2.5"/>
    <line x1="253" y1="195" x2="245" y2="192" stroke="#1a5276" stroke-width="2.5"/>
  </g>

  <!-- OD dimension line -->
  <line x1="250" y1="340" x2="390" y2="340" stroke="#000" stroke-width="0.8"/>
  <line x1="250" y1="336" x2="250" y2="344" stroke="#000" stroke-width="0.8"/>
  <line x1="390" y1="336" x2="390" y2="344" stroke="#000" stroke-width="0.8"/>
  <line x1="250" y1="210" x2="250" y2="340" stroke="#000" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="390" y1="210" x2="390" y2="340" stroke="#000" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="320" y="352" font-size="8" text-anchor="middle" fill="#000">OD</text>

  <!-- ID dimension line -->
  <line x1="285" y1="210" x2="355" y2="210" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="285" y1="207" x2="285" y2="213" stroke="#c0392b" stroke-width="0.8"/>
  <line x1="355" y1="207" x2="355" y2="213" stroke="#c0392b" stroke-width="0.8"/>
  <text x="320" y="225" font-size="7" text-anchor="middle" fill="#c0392b">ID</text>

  <!-- Centre cross -->
  <line x1="315" y1="210" x2="325" y2="210" stroke="#888" stroke-width="0.8"/>
  <line x1="320" y1="205" x2="320" y2="215" stroke="#888" stroke-width="0.8"/>

  <!-- Lead position dots in plan view -->
  <circle cx="306" cy="277" r="3" fill="#c0392b"/>
  <circle cx="314" cy="279" r="3" fill="#1a5276"/>
  <text x="300" y="295" font-size="7" fill="#c0392b" text-anchor="middle">P1</text>
  <text x="314" y="295" font-size="7" fill="#1a5276" text-anchor="middle">P2</text>

  <circle cx="326" cy="279" r="3" fill="#c0392b" stroke="#c0392b" stroke-dasharray="2,1"/>
  <circle cx="334" cy="277" r="3" fill="#1a5276" stroke="#1a5276" stroke-dasharray="2,1"/>
  <text x="326" y="295" font-size="7" fill="#c0392b" text-anchor="middle">P3</text>
  <text x="334" y="295" font-size="7" fill="#1a5276" text-anchor="middle">P4</text>

  <!-- ═══════════════════════════════════════════════
       DIMENSION TABLE (top right)
  ══════════════════════════════════════════════════ -->
  <text x="540" y="108" font-size="10" font-weight="bold" fill="#000">DESIGN PARAMETERS</text>
  <text x="540" y="122" font-size="8" fill="#555">(to be confirmed with Coiltek)</text>

  <!-- Table -->
  <rect x="530" y="130" width="240" height="200" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="530" y1="148" x2="770" y2="148" stroke="#000" stroke-width="0.8"/>
  <line x1="530" y1="166" x2="770" y2="166" stroke="#000" stroke-width="0.8"/>
  <line x1="530" y1="184" x2="770" y2="184" stroke="#000" stroke-width="0.8"/>
  <line x1="530" y1="202" x2="770" y2="202" stroke="#000" stroke-width="0.8"/>
  <line x1="530" y1="220" x2="770" y2="220" stroke="#000" stroke-width="0.8"/>
  <line x1="530" y1="238" x2="770" y2="238" stroke="#000" stroke-width="0.8"/>
  <line x1="530" y1="256" x2="770" y2="256" stroke="#000" stroke-width="0.8"/>
  <line x1="530" y1="274" x2="770" y2="274" stroke="#000" stroke-width="0.8"/>
  <line x1="650" y1="130" x2="650" y2="330" stroke="#000" stroke-width="0.8"/>

  <!-- Header row -->
  <rect x="530" y="130" width="240" height="18" fill="#1a5276"/>
  <text x="580" y="143" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Parameter</text>
  <text x="710" y="143" font-size="9" font-weight="bold" fill="white" text-anchor="middle">Value / Note</text>

  <!-- Rows -->
  <text x="534" y="160" font-size="8" fill="#000">Winding type</text>
  <text x="654" y="160" font-size="8" fill="#000">Bifilar — side by side</text>

  <text x="534" y="178" font-size="8" fill="#000">Crossing / twisting</text>
  <text x="654" y="178" font-size="8" fill="#c0392b" font-weight="bold">NONE</text>

  <text x="534" y="196" font-size="8" fill="#000">Conductors</text>
  <text x="654" y="196" font-size="8" fill="#000">2 (enamelled copper)</text>

  <text x="534" y="214" font-size="8" fill="#000">Pinout style</text>
  <text x="654" y="214" font-size="8" fill="#000">A — Vertical</text>

  <text x="534" y="232" font-size="8" fill="#000">Lead length</text>
  <text x="654" y="232" font-size="8" fill="#000">60 mm minimum</text>

  <text x="534" y="250" font-size="8" fill="#000">Op. frequency</text>
  <text x="654" y="250" font-size="8" fill="#000">DC – 10 kHz</text>

  <text x="534" y="268" font-size="8" fill="#000">Self-resonant freq.</text>
  <text x="654" y="268" font-size="8" fill="#000">&gt; 1 MHz (TBC)</text>

  <text x="534" y="286" font-size="8" fill="#000">Inductance target</text>
  <text x="654" y="286" font-size="8" fill="#555">TBC — advise per SRF</text>

  <text x="534" y="304" font-size="8" fill="#000">Core material</text>
  <text x="654" y="304" font-size="8" fill="#555">Ferrite — advise grade</text>

  <text x="534" y="322" font-size="8" fill="#000">Qty prototype</text>
  <text x="654" y="322" font-size="8" fill="#000">3 samples</text>

  <!-- ═══════════════════════════════════════════════
       WINDING DETAIL (bottom left)
  ══════════════════════════════════════════════════ -->
  <text x="100" y="368" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">BIFILAR WINDING DETAIL</text>
  <text x="100" y="380" font-size="8" text-anchor="middle" fill="#555">(cross-section, not to scale)</text>

  <!-- Two conductors side by side cross-section -->
  <circle cx="75" cy="420" r="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="97" cy="420" r="10" fill="#e8eef8" stroke="#1a5276" stroke-width="1.5"/>
  <text x="75" y="424" font-size="8" text-anchor="middle" fill="#c0392b">A</text>
  <text x="97" y="424" font-size="8" text-anchor="middle" fill="#1a5276">B</text>
  <text x="86" y="445" font-size="7" text-anchor="middle" fill="#000">Side-by-side</text>
  <text x="86" y="455" font-size="7" text-anchor="middle" fill="#000">no twist</text>

  <!-- Arrow between "wrong" cross -->
  <text x="135" y="418" font-size="20" fill="#c0392b">✗</text>
  <circle cx="175" cy="420" r="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="182" cy="412" r="10" fill="#e8eef8" stroke="#1a5276" stroke-width="1.5"/>
  <text x="175" y="424" font-size="8" text-anchor="middle" fill="#c0392b">A</text>
  <text x="182" y="416" font-size="8" text-anchor="middle" fill="#1a5276">B</text>
  <text x="178" y="445" font-size="7" text-anchor="middle" fill="#c0392b">Do NOT cross</text>
  <text x="178" y="455" font-size="7" text-anchor="middle" fill="#c0392b">or twist</text>

  <!-- ═══════════════════════════════════════════════
       PIN LEGEND (bottom centre)
  ══════════════════════════════════════════════════ -->
  <text x="340" y="368" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">PIN LEGEND</text>

  <!-- Legend table -->
  <rect x="240" y="378" width="200" height="100" fill="none" stroke="#000" stroke-width="0.8"/>
  <line x1="240" y1="394" x2="440" y2="394" stroke="#000" stroke-width="0.8"/>
  <line x1="240" y1="412" x2="440" y2="412" stroke="#000" stroke-width="0.8"/>
  <line x1="240" y1="430" x2="440" y2="430" stroke="#000" stroke-width="0.8"/>
  <line x1="240" y1="448" x2="440" y2="448" stroke="#000" stroke-width="0.8"/>
  <line x1="280" y1="378" x2="280" y2="478" stroke="#000" stroke-width="0.8"/>
  <line x1="340" y1="378" x2="340" y2="478" stroke="#000" stroke-width="0.8"/>

  <rect x="240" y="378" width="200" height="16" fill="#1a5276"/>
  <text x="260" y="390" font-size="8" font-weight="bold" fill="white" text-anchor="middle">Pin</text>
  <text x="310" y="390" font-size="8" font-weight="bold" fill="white" text-anchor="middle">Conductor</text>
  <text x="390" y="390" font-size="8" font-weight="bold" fill="white" text-anchor="middle">Description</text>

  <text x="260" y="407" font-size="8" fill="#c0392b" text-anchor="middle" font-weight="bold">P1</text>
  <text x="310" y="407" font-size="8" fill="#c0392b" text-anchor="middle">A</text>
  <text x="390" y="407" font-size="8" fill="#000" text-anchor="middle">Conductor A — Start</text>

  <text x="260" y="425" font-size="8" fill="#1a5276" text-anchor="middle" font-weight="bold">P2</text>
  <text x="310" y="425" font-size="8" fill="#1a5276" text-anchor="middle">B</text>
  <text x="390" y="425" font-size="8" fill="#000" text-anchor="middle">Conductor B — Start</text>

  <text x="260" y="443" font-size="8" fill="#c0392b" text-anchor="middle" font-weight="bold">P3</text>
  <text x="310" y="443" font-size="8" fill="#c0392b" text-anchor="middle">A</text>
  <text x="390" y="443" font-size="8" fill="#000" text-anchor="middle">Conductor A — Finish</text>

  <text x="260" y="461" font-size="8" fill="#1a5276" text-anchor="middle" font-weight="bold">P4</text>
  <text x="310" y="461" font-size="8" fill="#1a5276" text-anchor="middle">B</text>
  <text x="390" y="461" font-size="8" fill="#000" text-anchor="middle">Conductor B — Finish</text>

  <text x="260" y="475" font-size="7" fill="#555" text-anchor="middle">—</text>
  <text x="390" y="475" font-size="7" fill="#555" text-anchor="middle">Colour TBC with Coiltek</text>

  <!-- ═══════════════════════════════════════════════
       NOTES
  ══════════════════════════════════════════════════ -->
  <text x="480" y="368" font-size="10" font-weight="bold" fill="#000">GENERAL NOTES</text>
  <text x="480" y="384" font-size="8" fill="#000">1. Bifilar winding: two conductors wound simultaneously,</text>
  <text x="480" y="396" font-size="8" fill="#000">   side-by-side, NO crossing or twisting at any point.</text>
  <text x="480" y="410" font-size="8" fill="#000">2. Hand winding acceptable for prototype quantity (x3).</text>
  <text x="480" y="422" font-size="8" fill="#000">3. Core material, grade, OD, ID, and H to be advised</text>
  <text x="480" y="434" font-size="8" fill="#000">   by Coiltek based on SRF &gt; 1 MHz requirement.</text>
  <text x="480" y="446" font-size="8" fill="#000">4. Inductance target TBC — primary constraint is</text>
  <text x="480" y="458" font-size="8" fill="#000">   self-resonant frequency &gt; 1 MHz.</text>
  <text x="480" y="470" font-size="8" fill="#000">5. Lead conductors: enamelled copper (magnet wire).</text>
  <text x="480" y="482" font-size="8" fill="#000">6. This drawing is indicative. Coiltek to confirm all</text>
  <text x="480" y="494" font-size="8" fill="#c0392b">   dimensions before proceeding to quote.</text>

  <!-- AGPL notice -->
  <text x="22" y="600" font-size="6.5" fill="#888">NexusOS Hardware Specification — AGPL-3.0 — First disclosed 2026-05-16 — wnsp.tech</text>

